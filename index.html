<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoAnimeZ</title>
<link rel="manifest" href="manifest.json">
<style>
body { margin:0; font-family:Arial; background:#0f0f14; color:white; }
header { padding:20px; text-align:center; font-size:24px; font-weight:bold; }
.container { padding:20px; }
button { padding:15px; margin:10px 0; width:100%; border:none; border-radius:10px; font-size:16px; background:#6c5ce7; color:white; }
.card { background:#1e1e2a; padding:15px; border-radius:12px; margin:10px 0; }
img { width:100%; border-radius:10px; }
.nav { position:fixed; bottom:0; width:100%; display:flex; background:#111; }
.nav button { flex:1; margin:0; border-radius:0; background:#111; }
.hidden { display:none; }
</style>
</head>
<body>

<header>NeoAnimeZ</header>

<div id="home" class="container">
<h2>¿Qué anime empiezo a ver?</h2>
<button onclick="recommend()">Recomiéndame uno</button>
<div id="result"></div>
</div>

<div id="ranking" class="container hidden">
<h2>Ranking NeoAnimeZ</h2>
<div id="rankingList"></div>
</div>

<div id="shop" class="container hidden">
<h2>Tienda Online</h2>
<p>Próximamente...</p>
</div>

<div class="nav">
<button onclick="show('home')">Buscar</button>
<button onclick="show('ranking')">Ranking</button>
<button onclick="show('shop')">Tienda</button>
</div>

<script>
const rankingTop = [
{ title:"One Piece", img:"https://cdn.myanimelist.net/images/anime/6/73245.jpg"},
{ title:"Hajime no Ippo", img:"https://cdn.myanimelist.net/images/anime/10/18805.jpg"},
{ title:"Dragon Ball Z", img:"https://cdn.myanimelist.net/images/anime/6/20936.jpg"},
{ title:"Shingeki no Kyojin", img:"https://cdn.myanimelist.net/images/anime/10/47347.jpg"},
{ title:"Naruto", img:"https://cdn.myanimelist.net/images/anime/13/17405.jpg"},
{ title:"Rurouni Kenshin", img:"https://cdn.myanimelist.net/images/anime/7/6003.jpg"},
{ title:"Hunter x Hunter", img:"https://cdn.myanimelist.net/images/anime/11/33657.jpg"},
{ title:"Death Note", img:"https://cdn.myanimelist.net/images/anime/9/9453.jpg"},
{ title:"Frieren", img:"https://cdn.myanimelist.net/images/anime/1015/138006.jpg"},
{ title:"Kimetsu no Yaiba", img:"https://cdn.myanimelist.net/images/anime/1286/99889.jpg"}
];

function show(section){
document.getElementById('home').classList.add('hidden');
document.getElementById('ranking').classList.add('hidden');
document.getElementById('shop').classList.add('hidden');
document.getElementById(section).classList.remove('hidden');
}

function loadRanking(){
const container = document.getElementById("rankingList");
container.innerHTML="";
rankingTop.forEach((anime,i)=>{
container.innerHTML += `
<div class="card">
<h3>#${i+1} ${anime.title}</h3>
<img src="${anime.img}">
</div>`;
});
}

function recommend(){
const random = rankingTop[Math.floor(Math.random()*rankingTop.length)];
document.getElementById("result").innerHTML = `
<div class="card">
<h3>${random.title}</h3>
<img src="${random.img}">
</div>`;
}

loadRanking();
</script>

</body>
</html>
