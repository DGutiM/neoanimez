name: Actualizar datos mensuales

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 1 * *"

concurrency:
  group: neoanimez-monthly-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update-data:
    name: Preparar revision de datos
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guardar punto de restauracion
        shell: bash
        run: |
          RUN_DATE="$(date -u +%F)"
          SHORT_SHA="${GITHUB_SHA::7}"
          BACKUP_TAG="backup/published-${RUN_DATE}-${SHORT_SHA}"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "El punto de restauracion \`$BACKUP_TAG\` ya existe." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "NeoAnimeZ Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$BACKUP_TAG" "$GITHUB_SHA" -m "Version publicada antes de la actualizacion mensual ${RUN_DATE}"
          git push origin "$BACKUP_TAG"

          {
            echo "## Copia de seguridad"
            echo
            echo "Version publicada guardada en \`$BACKUP_TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar cache de fuentes y traducciones
        uses: actions/cache@v4
        with:
          path: |
            cache/catalog-sources-v1
            cache/title-es-cache.json
            cache/description-es-cache.json
            cache/catalog-related-pending.json
          key: catalog-sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            catalog-sources-v1-

      - name: Comprobar protecciones antes de descargar
        run: python3 -m unittest discover -s scripts -p 'test_catalog_sources.py' -v

      - name: Actualizar catalogo y calendarios
        run: python3 scripts/actualizar_datos_mensuales.py --apply

      - name: Validar publicacion
        run: |
          node --check assets/neoanimez.js
          node --check assets/anime-extras.js
          node --check service-worker.js
          node --test scripts/test_*.cjs
          python3 scripts/auditar_index_html.py
          python3 scripts/verificar_publicacion.py
          python3 scripts/actualizar_extras_anime.py --validate
          git diff --check

      - name: Guardar informe de la actualizacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-sync-report
          path: cache/catalog-sync-report.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Crear o actualizar la revision
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No hay cambios de datos este mes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="automation/monthly-data-refresh"
          RUN_DATE="$(date -u +%F)"
          git config user.name "NeoAnimeZ Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Actualiza datos de anime (${RUN_DATE})"
          git push --force-with-lease origin "$BRANCH"

          COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          ISSUE_NUMBER="$(gh issue list --state open --search 'Revision mensual de datos in:title' --json number --jq '.[0].number // empty')"
          TITLE="Revision mensual de datos lista (${RUN_DATE})"
          BODY="$(printf '%s\n\n%s\n\n%s\n\n%s' \
            'La actualizacion automatica mensual ha terminado y permanece aislada de la web publica.' \
            "Revisar los cambios: ${COMPARE_URL}" \
            'Incluye catalogo, estados, episodios, proximos estrenos, calendario, relaciones, mapas y fichas divididas. Conserva las traducciones y los datos anteriores si una fuente discrepa. El informe catalog-sync-report del workflow detalla los casos pendientes de revision.' \
            'Para publicarla, abre la comparacion, crea la pull request y fusionala cuando la revision sea correcta. GitHub Pages no publicara nada antes de ese paso.')"

          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue edit "$ISSUE_NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

          {
            echo "## Revision mensual preparada"
            echo
            echo "Los cambios estan aislados en \`$BRANCH\` y aun no se han publicado."
            echo
            echo "[Abrir comparacion y crear la pull request]($COMPARE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
